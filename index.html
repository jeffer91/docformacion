<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocFormación ITSQMET</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DF</div>
        <div>
          <strong>DocFormación</strong>
          <span>UGPA · Formación Docente</span>
        </div>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="inicio">Inicio</button>

        <div class="nav-label">DOCUMENTOS</div>
        <button class="nav-item doc-link" data-view="doc-dnf">Detección de Necesidades</button>
        <button class="nav-item doc-link" data-view="doc-plan">Plan de Formación</button>
        <button class="nav-item doc-link" data-view="doc-informe">Informe de Cumplimiento</button>
      </nav>

      <div class="sidebar-footer">
        <button id="btnTemplate" class="secondary full">Plantilla Excel global</button>
        <button id="btnImport" class="primary full">Importar Excel global</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Inicio</h1>
          <p id="viewSubtitle">Gestión integrada de DNF, Plan e Informe.</p>
        </div>
        <div class="save-state" id="saveState">Guardado</div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <dialog id="teacherDialog">
    <form method="dialog" id="teacherForm">
      <div class="dialog-header">
        <div>
          <h2 id="teacherDialogTitle">Docente</h2>
          <p>Solo campos necesarios para los documentos.</p>
        </div>
        <button type="button" class="icon-btn" id="closeTeacher">×</button>
      </div>
      <div id="teacherFields" class="form-grid"></div>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelTeacher">Cancelar</button>
        <button type="submit" class="primary">Guardar docente</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="web-adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
